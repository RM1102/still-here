<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Still Here · For places and staff</title>
<meta name="description" content="The contributor side of Still Here: verified clinics, pharmacies, ration shops and shelters update what they have. A prototype; simulated data.">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08080A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="css/apple/apple-system-colors.css">
<link rel="stylesheet" href="css/apple/apple-materials.css">
<link rel="stylesheet" href="css/apple/apple-buttons.css">
<link rel="stylesheet" href="css/apple/apple-feedback.css">
<link rel="stylesheet" href="css/app.css">
<style>
  /* Same shell as the public app: a sidebar of places, the update in the middle */
  .cshell { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; }
  .cside { height: 100vh; overflow-y: auto; padding: 18px 12px; border-right: 1px solid var(--hair); background: var(--group); display: flex; flex-direction: column; gap: 10px; }
  .cside .brand { padding: 4px 8px 6px; }
  .csearch { display: flex; align-items: center; gap: 8px; padding: 0 10px; min-height: 38px; border-radius: 10px; background: var(--fill); color: var(--label2); }
  .csearch input { flex: 1; border: 0; background: transparent; color: var(--label); font: inherit; font-size: 15px; outline: none; min-width: 0; }
  .ckinds { display: flex; flex-wrap: wrap; gap: 6px; }
  .ckinds button { border: 0; border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; background: var(--fill); color: var(--label); cursor: pointer; }
  .ckinds button.on { background: var(--label); color: var(--canvas); }
  .clist { display: flex; flex-direction: column; gap: 2px; }
  .clist button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--label); font: inherit; padding: 8px 8px; border-radius: 10px; cursor: pointer; }
  .clist button:hover { background: var(--fill); } .clist button.on { background: color-mix(in srgb, var(--apple-blue) 16%, transparent); }
  .clist .tt { display: flex; flex-direction: column; min-width: 0; } .clist .tt b { display: block; font-size: 14.5px; font-weight: 500; line-height: 1.3; } .clist .tt span { display: block; font-size: 12.5px; color: var(--label2); margin-top: 1px; }
  .cside a.brand { color: inherit; text-decoration: none; }
  .clist .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-left: auto; }
  .cfoot { margin-top: auto; font-size: 12.5px; color: var(--label2); padding: 8px; line-height: 1.5; } .cfoot a { color: var(--accent); }
  .cmain { height: 100vh; overflow-y: auto; }
  .form .r { flex-wrap: wrap; row-gap: 8px; } .form .r .tt { flex: 1 1 140px; }
  .form textarea, .form input[type=text] { width: 100%; min-height: 40px; border-radius: 10px; border: 1px solid var(--hair); background: var(--fill); color: var(--label); font: inherit; padding: 8px 10px; }
  .form textarea { min-height: 56px; }
  .tier { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--fill); white-space: nowrap; }
  @media (max-width: 760px) { .cshell { grid-template-columns: 1fr; height: auto; } .cside, .cmain { height: auto; } .cside { border-right: 0; border-bottom: 1px solid var(--hair); max-height: 46vh; } }
</style>
</head>
<body class="contrib">
<div class="cshell">
  <aside class="cside" aria-label="Places">
    <a class="brand" href="index.html"><span class="mark"><i></i></span><div><b>Still Here</b><span>For places and staff</span></div></a>
    <label class="csearch"><span id="sicon"></span><input id="csearch" type="search" placeholder="Search places" aria-label="Search places"></label>
    <div class="ckinds" id="ckinds"></div>
    <div class="clist" id="clist"></div>
    <button class="btn btn-block" data-add="1" id="addbtn"></button>
    <div class="cfoot">Every place here is simulated. <a href="index.html">Public app</a> · <a href="cockpit.html">Government view</a></div>
  </aside>
  <main class="cmain"><div class="content" id="view"></div></main>
</div>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/contributor.js"></script>
</body>
</html>
